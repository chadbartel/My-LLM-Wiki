name: Wiki Auto-Sync (Weekly)

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tomli

      - name: Run Wiki Sync
        run: |
          cd /home/thatsmidnight/projects/Homelab-Ansible
          python scripts/sync-wiki.py --verbose
        continue-on-error: true

      - name: Commit Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🔄 Wiki auto-sync: $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
        continue-on-error: true

      - name: Summary
        run: |
          echo "✅ Wiki auto-sync completed"
          echo "Check the git log for details"
